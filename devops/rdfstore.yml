# Deployment of rdfStore, the RDF4J store/SPARQL service split out of cpmeta.
# This is the playbook meta's build.sbt points its rdfStore project at
# (cpDeployPlaybook := "rdfstore.yml", cpDeployTarget := "cpmeta_rdfstore"), so
# `sbt "project rdfStore" "cpDeploy to <inventory>"` ends up here.
#
# The public https://<meta host>/sparql route lives in cpmeta's nginx config (it is a location
# on the meta server block), so proxy changes are made through core.yml/cpmeta.yml; this
# playbook only manages the rdfStore application itself.
- hosts: core_host
  tags: host
  pre_tasks:
    # meta is restricted to the meta_permitted_inventory inventory for now; see
    # group_vars/all/core.yml.
    - name: Check that meta may be deployed to this inventory
      assert:
        that: meta_deploy_permitted
        fail_msg: >-
          meta may not be deployed to the "{{ meta_inventory_name }}" inventory: this branch
          deploys only the store-split codebase, and moving a deployment over to it requires
          migrating its RDF store first. Only "{{ meta_permitted_inventory }}" may be
          deployed to; see meta_permitted_inventory in group_vars/all/core.yml.
      tags:
        - always

    - name: Setup java
      tags:
        - java
        - cpmeta_rdfstore_setup
      import_role:
        name: icos.java

  roles:
    - role: icos.cpmeta_rdfstore
