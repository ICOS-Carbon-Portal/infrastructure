# core-service-related variables reused by different inventories (production, staging, cities)

jre_apt_package: openjdk-21-jre-headless
java_path: /usr/lib/jvm/java-21-openjdk-amd64/bin/java

restheart_icos_db_name: db
restheart_sites_db_name: sitesdb
restheart_cities_db_name: pauldb

restheart_cities_domain: cityrestheart.icos-cp.eu

postgis_icos_db_name: cplog
postgis_sites_db_name: siteslog
postgis_cities_db_name: paullog

# rdfStore, the RDF4J store/SPARQL service split out of cpmeta. Only deployed on the test-fs4
# VM for now: it requires a meta jar built from the split codebase, so enabling it against a
# deployment running the old, embedded-store meta would break that deployment. The flag also
# switches the corresponding cpmeta bits (remote repository config, /sparql proxy target,
# ownership of the RDF storage directory, service ordering), which is why it has to be
# readable both on core_host and on core_server.
cpmetardfstore_enable: false
cpmetardfstore_port: 9095
cpmetardfstore_host: "{{ coreapp_httpproxy_host }}"

postgis_container_name: postgis
rdflog_container_name: rdflog

activity_log_ignore_ips: ["127.0.0.1", "130.235.98.79", "130.235.98.177", "130.235.98.81", "130.235.98.184", "130.235.99.156", "130.235.147.17", "83.253.16.56"]
