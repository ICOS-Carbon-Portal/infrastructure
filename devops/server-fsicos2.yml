# Upgrade certbot
#   icos play fsicos2 nginx_certbot -ecertbot_state=latest

- hosts: fsicos2
  roles:
    - role: icos.server
      tags: server

    - role: icos.docker
      tags: docker

    - role: icos.nginx
      tags: nginx

    - role: icos.bbserver
      tags: bbserver

    - role: icos.nfs4
      tags: nfs

    # Daily push of new dataAppStorage files to fsicos4:/tank/dataAppStorage
    #   icos play fsicos2 dataappstorage_sync
    - role: icos.dataappstorage_sync
      tags: dataappstorage_sync
