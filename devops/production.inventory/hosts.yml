all:
  # GLOBAL VARS
  vars:
    nginx_testing_users: "{{ vault_nginx_testing_users }}"

    # root_keys is what each VM needs to override.
    root_keys: "{{ vault_root_keys }}"

    # The keys used by lxd_guest when provisioning the vm
    lxd_guest_root_keys: "{{ root_keys }}"

    # The keys installed by lxd_vm when creating the VM, necessary to even
    # connect to the vm using ansible.
    lxd_vm_root_keys: "{{ root_keys }}"

    ansible_user: root
    quince_ext_port: 60522

    icos1_ip: 130.235.74.215
    fsicos1_ip: 194.47.223.133
    fsicos2_ip: 194.47.223.139
    fsicos3_ip: 194.47.223.137
    fsicos4_ip: 130.235.92.135
    cdb_ip: 130.235.99.237

    # The connection information for the rdflog database, we keep it here since
    # it's shared between several roles.
    rdflog_db_pass: "{{ vault_rdflog_db_pass }}"

    registry_domain: registry.icos-cp.eu

  hosts:
    fsicos4:
      external_ip: 130.235.92.135
      # auto-DNAT removes forwarding rules for static VMs without DHCP leases.
      # Keep it disabled until it can resolve their static addresses.
      pve_auto_dnat_enabled: false

  children:
    # ALIASES
    # We create a child group, even though it only contains a single
    # server. That way ansible will pick up host_vars correctly.
    staging_server:
      hosts:
        fsicos2:
    postgis_server:
      hosts:
        fsicos2:

    # PHYSICAL SERVERS
    physical_servers:
      vars:
        iptables_forward: true
      hosts:
        fsicos4:
          firewall_enabled: false
        cdb:
          root_keys: "{{ vault_cdb_root_keys }}"
        icos1:
          ansible_port: 60022
        fsicos2:
          root_keys: "{{ vault_fsicos2_root_keys }}"
          ansible_port: 60022
        fsicos3:

    fsicos4_vms:
      vars:
        ansible_user: debian
        ansible_become: yes
        ansible_host: fsicos4
        root_keys: "{{ vault_fsicos4_vms_root_keys }}"
      hosts:
        cupcake:
          ansible_port: 60603
          user_conf: "{{ vault_cupcake_user_conf }}"
        pancake:
          ansible_port: 60605
          ansible_user: root
          user_conf: "{{ vault_pancake_user_conf }}"
        fsicos4-stiltcluster:
          ansible_port: 60601
        fdp:
          ansible_port: 60606
          ansible_user: fdp
        fsicos4-wordpress:
          ansible_port: 60614
          ansible_user: root
          # Static, set in /etc/netplan/01-static.yaml (ISO install, no cloud-init).
          vm_ip: 10.10.10.201
          vm_mac: BC:24:11:83:9D:A7
        fsicos4-drupal:
          ansible_port: 60621
          ansible_user: root
          # Static, set with qm set --ipconfig0 (Proxmox cloud-init).
          vm_ip: 10.10.10.200
          vm_mac: BC:24:11:8C:CC:7E
        fsicos4-envri:
          # VM 128. envri.eu only; SITSYSTECH (the site's web agency) logs in
          # as an unprivileged user, see vm-fsicos4-envri.yml.
          ansible_port: 60622
          # Personal account with sudo, see host_vars/fsicos4-envri.
          ansible_user: jonathan
          # Static, set with qm set --ipconfig0 (Proxmox cloud-init).
          vm_ip: 10.10.10.202
          vm_mac: BC:24:11:99:DA:BE
        fsicos4-ericforum:
          # VM 129. eric-forum.eu only; Bluedrop (the site's web agency) logs
          # in as an unprivileged user, see vm-fsicos4-ericforum.yml.
          ansible_port: 60623
          # Personal account with sudo, see host_vars/fsicos4-ericforum.
          ansible_user: jonathan
          # Static, set with qm set --ipconfig0 (Proxmox cloud-init).
          vm_ip: 10.10.10.203
          vm_mac: BC:24:11:B5:43:9A
        fsicos4-repotest:
          # VM 130. Temporary: Nexus 3 vs Reposilite + Verdaccio, the
          # candidates to replace Nexus 2 (repo.icos-cp.eu), see
          # vm-fsicos4-repotest.yml. Delete the VM once we have chosen.
          ansible_port: 60624
          # Personal account with sudo, see host_vars/fsicos4-repotest.
          ansible_user: jonathan
          # Static, set with qm set --ipconfig0 (Proxmox cloud-init).
          vm_ip: 10.10.10.204
          vm_mac: BC:24:11:AB:2F:AC
        fsicos4-sites:
          # VM 131. SITES core services (doi.fieldsites.se, later cpmeta,
          # cpdata, cpauth). The base system is set up by
          # vm-fsicos4-sites.yml; the applications are deployed with
          # sites.inventory, where this VM is called "sites".
          ansible_port: 60619
          # Personal account with sudo, see host_vars/fsicos4-sites.
          ansible_user: jonathan
          # Static, set with qm set --ipconfig0 (Proxmox cloud-init). Outside
          # the DHCP range, so there is no dnsmasq reservation. fsicos4's
          # /etc/hosts resolves "sites" to it for the Caddy upstreams.
          vm_ip: 10.10.10.25
          vm_mac: BC:24:11:15:D6:7C
        test-fs4:
          ansible_port: 60608
          ansible_user: root
        fsicos4-flexpart:
          ansible_port: 60611
          ansible_user: root
        sentry:
          ansible_port: 60612
          ansible_user: root
        flexextract:
          ansible_port: 60602
          user_conf: "{{ vault_flexextract_user_conf }}"
        mapproxy:
          ansible_port: 60620
          ansible_user: root


    # CDB VMS
    cdb_vms:
      vars:
        ansible_host: cdb
      hosts:
        pgrep2:
          ansible_port: 60550

    # FSICOS2 VMS
    fsicos2_vms:
      vars:
          ansible_host: fsicos2
      hosts:
        build:
          ansible_port: 60525
        staging:
          ansible_port: 60520
        erddap-next:
          ansible_port: 60581
          root_keys: "{{ vault_erddap_root_keys }}"
        postgis:
          ansible_port: 60590
          user_conf: "{{ vault_postgis_user_conf }}"
        # quince was the first, quince2 was a storage migration gone bad,
        # quince3 is the new VM.
        quince3:
          ansible_port: 60600
          quince_jdk_version: 17
          user_conf: "{{ vault_quince3_user_conf }}"
        rspamd:
          ansible_port: 60585
        cities:
          ansible_port: 60565

    # FSICOS3 VMS
    fsicos3_vms:
      vars:
        ansible_host: fsicos3
      hosts:
        amalthea:
          ansible_port: 60560
        callisto:
          ansible_port: 60510
          docker_prevent_upgrade: True
        exploredata:
          ansible_port: 60555
          docker_prevent_upgrade: True
          root_keys: "{{ vault_exploredata_root_keys }}"
        flexpart:
          ansible_port: 60530
          docker_prevent_upgrade: True
        ganymede:
          ansible_port: 60540
          docker_prevent_upgrade: True
          python3_version_list:
            - "3.10"
            - "3.11"
        jupyter:
          root_keys: "{{ vault_jupyter_root_keys }}"
          ansible_port: 60535
          docker_prevent_upgrade: True
          bbclient_name: jupyter
          jupyter_backup_enable: true
          python3_version_list:
            - "3.10"
            - "3.11"
        molefractions:
          ansible_port: 60515
        registry:
          ansible_port: 60545
        pgrep1:
          ansible_port: 60570
        ctehires:
          ansible_port: 60575
        dokku:
          root_keys: "{{ vault_dokku_root_keys }}"
          ansible_port: 60595
