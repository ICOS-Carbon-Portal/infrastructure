# Drupal websites running on the fsicos4-drupal VM (vm-fsicos4-drupal.yml).
#
# Add a site here when it is migrated from fsicos2. A site is only served on
# its public domains once `live: true`; before that, test it through the VM
# directly:
#   curl -H 'Host: test.icos-otc.org' -H 'X-Forwarded-Proto: https' http://fsicos4-drupal.nebula/
#
# Secrets are read from the old icos.drupal role's vault files for now, so the
# migrated sites keep their database passwords and hash salt. Move them into
# vault.yml next to this file once fsicos2 no longer runs the old role.

drupal_legacy_vault: "{{ playbook_dir }}/roles/icos.drupal/vars"

drupal_sites:
  - name: otctest
    live: true
    domain: test.icos-otc.org
    modules: [bartik, linkit, media_alias_display, pathauto, redirect, smtp]
    secrets: "{{ _drupal_legacy_secrets['otctest'] }}"

  - name: "no"
    live: true
    domain: no.icos-cp.eu
    modules: [bartik, honeypot, linkit, media_alias_display, pathauto, redirect, smtp, webform]
    secrets: "{{ _drupal_legacy_secrets['no'] }}"

  - name: otc
    live: true
    domain: www.icos-otc.org
    redirect_domains: [icos-otc.org, otc.icos-cp.eu]
    modules: [bartik, redirect]
    secrets: "{{ _drupal_legacy_secrets['otc'] }}"

  - name: ac
    live: true
    domain: www.actris.se
    redirect_domains: [actris.se]
    modules: [bartik]
    secrets: "{{ _drupal_legacy_secrets['ac'] }}"

  - name: fi
    live: true
    domain: www.icos-finland.fi
    redirect_domains: [icos-finland.fi]
    modules: [bartik, linkit, pathauto, redirect, smtp]
    secrets: "{{ _drupal_legacy_secrets['fi'] }}"

  - name: se
    live: true
    domain: www.icos-sweden.se
    redirect_domains: [icos-sweden.se, sweden.icos-cp.eu]
    modules: [bartik, honeypot, linkit, pathauto, redirect, restui, smtp, toc_js, webform]
    secrets: "{{ _drupal_legacy_secrets['se'] }}"

  - name: ch
    live: true
    domain: www.icos-switzerland.ch
    redirect_domains: [switzerland.icos-cp.eu]
    modules: [bartik, honeypot, linkit, pathauto, redirect, smtp, webform]
    secrets: "{{ _drupal_legacy_secrets['ch'] }}"

  # Content and the Mailchimp settings still use demo.fieldsites.se; it
  # redirects with the path kept.
  - name: sites
    live: true
    domain: www.fieldsites.se
    redirect_domains: [fieldsites.se, demo.fieldsites.se]
    database_name: sites
    database_user: sites
    modules: [antibot, editor_advanced_link, feeds, honeypot, linkit, mailchimp, media_alias_display, menu_breadcrumb, metatag, pathauto, plausible, redirect, simple_sitemap, smtp, svg, token, twig_tweak, webform]
    secrets: "{{ _drupal_legacy_secrets['sites'] }}"

  - name: cp
    live: true
    domain: www.icos-cp.eu
    redirect_domains: [icos-cp.eu]
    modules: [bartik, better_exposed_filters, bootstrap, ckeditor5_plugin_pack, color_field, conflict, editor_advanced_link, honeypot, html_title, linkit, matomo, media_alias_display, media_bulk_upload, menu_breadcrumb, metatag, pathauto, readonlymode, redirect, scheduler, simple_sitemap, single_content_sync, smtp, toc_js, token, views_infinite_scroll, webform, webform_views]
    robots_txt: cp-robots.txt
    caddy_extra: |
      redir /license https://data.icos-cp.eu/licence permanent
      redir /site https://www.icos-cp.eu permanent
      redir /site/ https://www.icos-cp.eu permanent
    secrets: "{{ _drupal_legacy_secrets['cp'] }}"

  # Test copy of cp, like demo.icos-cp.eu on fsicos2. To make it a fresh copy
  # of cp again, run /docker/drupal/sites/demo/refresh.sh on the VM.
  - name: demo
    live: true
    domain: demo.icos-cp.eu
    copy_from: cp
    modules: [bartik, better_exposed_filters, bootstrap, ckeditor5_plugin_pack, color_field, conflict, editor_advanced_link, honeypot, html_title, linkit, matomo, media_alias_display, media_bulk_upload, menu_breadcrumb, metatag, pathauto, readonlymode, redirect, scheduler, simple_sitemap, single_content_sync, smtp, toc_js, token, views_infinite_scroll, webform, webform_views]
    caddy_extra: |
      header X-Robots-Tag "noindex, nofollow"
    secrets: "{{ _drupal_legacy_secrets['demo'] }}"

# Other fields (see roles/icos.drupal2/defaults/main.yml):
#   redirect_domains: [icos-otc.org]  # redirected to domain by the fsicos4 caddy
#   git_version, robots_txt, database_name, database_user, database_prefix,
#   caddy_extra, copy_from

# Retired sites whose domains now redirect elsewhere. Every path goes to `to`;
# the fsicos4 caddy serves these, the VM is not involved. `code` is passed to
# caddy's redir: temporary (default), permanent or a status code.
drupal_redirects:
  - domains: [www.icos-netherlands.nl, icos-netherlands.nl]
    to: https://www.icos-cp.eu/measurements/icos-countries/netherlands

_drupal_legacy_secrets: >-
  {%- set out = {} -%}
  {%- for name in ['otctest', 'no', 'otc', 'ac', 'fi', 'se', 'ch', 'sites', 'cp', 'demo'] -%}
  {%- set v = lookup('ansible.builtin.unvault', drupal_legacy_vault ~ '/' ~ name ~ '-vault.yml') | from_yaml -%}
  {%- set _ = out.update({name: {
        'mysql_root_password': v.vault_mysql_root_password,
        'mysql_icos_password': v.vault_mysql_icos_password,
        'hash_salt': v.vault_hash_salt,
        'drupal_sync_directory': v.vault_drupal_sync_directory}}) -%}
  {%- endfor -%}
  {{ out }}
