# Healthchecks (https://healthchecks.icos-cp.eu) in an LXD container on cdb.
# The domain must point to cdb before Caddy can get a certificate. After the
# first deploy, see roles/icos.healthchecks/README.md.
#
#   icos play vm-healthchecks -DC                  # everything
#   icos play vm-healthchecks -t caddy -DC         # cdb routing only
#   icos play vm-healthchecks -t healthchecks -DC  # the service only

- hosts: cdb
  vars:
    healthchecks_domain: healthchecks.icos-cp.eu
    healthchecks_port: 8000
  roles:
    - role: icos.lxd_vm
      tags: vm
      lxd_vm_name: healthchecks
      lxd_vm_docker: true
      lxd_vm_ubuntu_version: "24.04"
      lxd_vm_root_size: 20GB

  tasks:
    - name: Configure healthchecks reverse proxy
      tags: caddy
      include_role:
        name: icos.caddy
        apply:
          tags: caddy
      vars:
        caddy_name: healthchecks
        caddy_conf: |
          {{ healthchecks_domain }} {
              reverse_proxy healthchecks.lxd:{{ healthchecks_port }}
          }


- hosts: healthchecks
  vars:
    healthchecks_domain: healthchecks.icos-cp.eu
    healthchecks_port: 8000
  roles:
    - role: icos.lxd_guest
      tags: guest

    - role: icos.docker2
      tags: docker
      docker2_containerd_snapshotter: false

    - role: icos.healthchecks
      tags: healthchecks

  # Backups are not enabled yet, see roles/icos.healthchecks/tasks/backup.yml.
