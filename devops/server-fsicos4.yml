- hosts: fsicos4
  roles:
    - role: icos.mosh
      tags: mosh

    - role: icos.caddy
      tags: caddy

    - role: icos.pve_server
      tags: pve_server

    - role: icos.utils
      tags: utils

    - role: icos.python3
      tags: python

    - role: icos.fail2ban
      tags: fail2ban
      fail2ban_config_files:
        - dest: /etc/fail2ban/jail.d/sshd-allports.local
          content: |
            [sshd]
            # fail2ban won't start out of the box on proxmox8/debian12(?)
            # since it's configured to use /var/log/auth.log (which doesn't exist).
            # https://forum.proxmox.com/threads/missing-auth-log-in-proxmox-ve-8-0-fail2ban-sshd.130271/
            backend = systemd
            # Since we're running ssh on different ports that fail2ban is used
            # to, block all ports.
            banaction = iptables-allports

    - role: icos.dnsmasq
      tags: dnsmasq
      dnsmasq_interface: vmbr0
      dnsmasq_config: |
        # bind only to the interface given on the command line
        bind-interfaces

        # the range of addresses available for lease
        dhcp-range=10.10.10.50,10.10.10.250,12h

        # set default route
        dhcp-option={{ dnsmasq_interface }},3,10.10.10.1

        dhcp-leasefile=/var/lib/misc/dnsmasq.{{ dnsmasq_interface }}.leases

        server=8.8.8.8

        # dhcp-script=/usr/local/bin/icos-dnsmasq-script
        script-on-renewal

        # Fixed addresses. Synced from the live file on 2026-11-06; keep this
        # list complete, the role overwrites the whole file.
        dhcp-host=BC:24:11:37:21:37,staging-test,10.10.10.54,infinite
        dhcp-host=BC:24:11:17:BD:A5,opendap,10.10.10.99,infinite
        dhcp-host=BC:24:11:A1:D4:62,otc-meta,10.10.10.216,infinite
        dhcp-host=BC:24:11:47:64:F3,icos-op1,10.10.10.156,infinite
        dhcp-host=BC:24:11:C1:4B:C6,cupcake,10.10.10.59,infinite
        dhcp-host=BC:24:11:C8:6C:DD,flexpart,10.10.10.100,infinite
        dhcp-host=BC:24:11:CE:30:F6,icos-bw1,10.10.10.164,infinite
        dhcp-host=BC:24:11:4E:C5:C0,flexextract,10.10.10.165,infinite
        dhcp-host=BC:24:11:96:E6:99,dokku,10.10.10.145,infinite
        dhcp-host=BC:24:11:E7:3D:D2,sso-pilot,10.10.10.223,infinite   # (pilot)
        dhcp-host=BC:24:11:87:1B:2D,nextcloud-pilot,10.10.10.224,infinite   # (pilot)
        dhcp-host=BC:24:11:55:ED:6D,mapproxy,10.10.10.217,infinite

        # These VMs have static IPs (netplan / Proxmox cloud-init) and do not
        # use DHCP. Reserved here so dnsmasq never leases their addresses.
        dhcp-host=BC:24:11:83:9D:A7,wordpress,10.10.10.201,infinite
        dhcp-host=BC:24:11:8C:CC:7E,drupal,10.10.10.200,infinite

    # rsync -x -avz --progress ./ rsync://fsicos4.nebula/data/flexpart/
    - role: icos.rsyncd
      tags: rsyncd
      rsyncd_enable: true
      rsyncd_users:
        - name: root
      rsyncd_conf: |
        # only accept rsync on nebula interface
        address = fsicos4.nebula

        [data]
        # run this module as root instead of nobody
        uid = root
        gid = *
        comment = /tank/data
        path = /tank/data
        auth users = root:rw
        numeric ids
        secrets file = /etc/rsyncd.secrets
        hosts allow = fsicos2.nebula,fsicos3.nebula,icos1.nebula
