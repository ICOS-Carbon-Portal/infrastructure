# Provision the erddap-next container, certificates and nginx. The application
# is deployed separately with erddap.yml. See docs/erddap/README.md.
#   icos play vm-erddap                     # everything
#   icos play vm-erddap --tags cert,nginx   # certificates and proxy only
---
- name: Provision the ERDDAP container and serve its domains
  hosts: fsicos2
  vars:
    certbot_name: erddap
    certbot_domains:
      - erddap.icos-cp.eu
      - test-erddap.icos-cp.eu
      - bluecloud.icos-cp.eu

  roles:
    - role: icos.lxd_vm
      lxd_vm_name: erddap-next
      lxd_vm_ubuntu_version: "24.04"
      lxd_vm_root_pool: erddap-next
      lxd_vm_root_size: "100GB"
      lxd_vm_root_keys: "{{ hostvars['erddap-next'].root_keys }}"
      lxd_vm_docker: false
      lxd_vm_config:
        limits.cpu: "2"
        limits.memory: "20GB"
      lxd_vm_devices:
        dataAppStorage:
          path: /data/dataAppStorage
          source: /disk/data/dataAppStorage
          readonly: "1"
          type: disk

    - role: icos.certbot2
      tags: cert

    - role: icos.nginxsite
      tags: nginx
      nginxsite_name: erddap
      nginxsite_file: files/erddap.conf

- name: Prepare the container for the ERDDAP application
  hosts: erddap-next
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH access
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Wait for image initialization to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather guest facts
      ansible.builtin.setup:

  roles:
    - role: icos.lxd_guest

  tasks:
    - name: Install runtime and migration prerequisites
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - git
          - openjdk-25-jre-headless
          - python3
          - python3-venv
          - rsync
          - unzip
        state: present

    - name: Ensure the application owner exists
      ansible.builtin.user:
        name: ubuntu
        home: /home/ubuntu
        shell: /bin/bash
        create_home: true

    - name: Create the application directory
      ansible.builtin.file:
        path: /home/ubuntu/erddap.icos-cp.eu
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
