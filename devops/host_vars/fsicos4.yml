# ICOSDATA
icosdata_mkdirs:
  - /mnt/icos1/pool/flexextract/meteo

icosdata_nfs_mounts:
  - path: /mnt/icos1/pool/flexextract/meteo
    src: icos1.nebula:/pool/flexextract/meteo
    opts: "rw,_netdev,hard,timeo=600,retrans=2,x-systemd.after=nebula.service"

icosdata_exports: |
  /tank/flexextract 10.10.10.59/32(rw,async,no_subtree_check,no_root_squash) 10.10.10.100/32(rw,async,no_subtree_check,no_root_squash)

  # flexextract:
  /tank/flexextract 10.10.10.165/32(rw,async,no_subtree_check,no_root_squash) 10.10.10.145/32(rw,async,no_subtree_check,no_root_squash)

# CADDY
# fsicos2 forwards requests for names that moved here until their DNS has
# switched (fixes/sites-forward-fsicos2.yml). Trusting it makes Caddy take the
# client address from its X-Forwarded-For ({client_ip}, the access logs). fsicos2
# must replace that header rather than append to it: Caddy 2.7 uses the first
# entry and has no trusted_proxies_strict.
caddy_global_conf: |
  {
    servers {
      trusted_proxies static 194.47.223.139/32
    }
  }

  :80 {
    respond "Not found." 404
  }
