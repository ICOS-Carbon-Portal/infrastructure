# ICOSDATA
icosdata_mkdirs:
  - /mnt/icos1/pool/flexextract/meteo

icosdata_nfs_mounts:
  - path: /mnt/icos1/pool/flexextract/meteo
    src: icos1.nebula:/pool/flexextract/meteo
    opts: "rw,_netdev,hard,timeo=600,retrans=2,x-systemd.after=nebula.service"

icosdata_exports: |
  /tank/flexextract 10.10.10.59/32(rw,async,no_subtree_check,no_root_squash) 10.10.10.100/32(rw,async,no_subtree_check,no_root_squash)

  # flexextract:
  /tank/flexextract 10.10.10.165/32(rw,async,no_subtree_check,no_root_squash) 10.10.10.145/32(rw,async,no_subtree_check,no_root_squash)
