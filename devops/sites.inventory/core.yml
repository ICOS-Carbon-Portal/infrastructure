all:
  vars:
    fsicos4_ip: 130.235.92.135

    # Separate SITES core VM on fsicos4.
    #
    # Until the cutover from fsicos2, the VM is tested under
    # meta/data/auth.next.fieldsites.se (DNS: *.next.fieldsites.se points to
    # fsicos4), with PID minting and B2SAFE in dry-run mode, search engines
    # kept out and its own login cookie domain; see
    # templates/application_sites_next_amendment.conf (also the test banner).
    # At the cutover, set sites_next to false and redeploy cpmeta, cpdata,
    # cpauth and the proxy.
    # The object URIs stay https://meta.fieldsites.se/... either way.
    sites_next: true
    sites_domain: "{{ 'next.fieldsites.se' if sites_next else 'fieldsites.se' }}"

    cpauth_sites_domain: "auth.{{ sites_domain }}"
    cpmeta_sites_domain: "meta.{{ sites_domain }}"
    cpdata_sites_domain: "data.{{ sites_domain }}"

    cpauth_domains:
      - "{{ cpauth_sites_domain }}"

    cpmeta_domains:
      - "{{ cpmeta_sites_domain }}"

    cpdata_domains:
      - "{{ cpdata_sites_domain }}"

    doi_domains:
      - doi.fieldsites.se

    postgis_dbs:
      - "{{ postgis_sites_db_name }}"

    restheart_dbs:
      - "{{ restheart_sites_db_name }}"

    showUnderConstruction: "false"
    showCarbonBadge: "true"

    activity_log_ignore_ips: []

    # DOI application
    doi_envri: SITES
    # The live doi.fieldsites.se: always production's cpmeta, also while
    # cpmeta_sites_domain is the test name.
    doi_meta_domain: meta.fieldsites.se
    doi_auth_views_vars:
      cpauth_sites_domain: auth.fieldsites.se
      cpdata_sites_domain: data.fieldsites.se

  children:
    # The borg servers the backups go to (bbclient_remotes), as in
    # production.inventory/borgbackup.yml. Only delegated to; no play runs
    # on them from this inventory.
    bbservers:
      vars:
        ansible_user: root
        ansible_port: 60022
        bbserver_host: "{{ inventory_hostname_short }}.nebula"
        bbserver_user: bbserver
        bbserver_port: 60022
      hosts:
        icos1:
          bbserver_home: /pool/bbserver
        fsicos2:
          bbserver_home: /disk/data/bbserver

    core_host:
      hosts:
        # VM 131 on fsicos4 (fsicos4-sites in production.inventory, whose
        # vm-fsicos4-sites.yml sets up the base system and admin accounts).
        sites:
          ansible_host: fsicos4.icos-cp.eu
          ansible_port: 60619
          ansible_user: jonathan
          ansible_become: true

      vars:
        # Services bind to all VM interfaces because the reverse proxy runs on the fsicos4 host.
        # vm-fsicos4-sites.yml only lets fsicos4 (10.10.10.1) reach their ports.
        coreapp_bind_addr: 0.0.0.0
        # restheart is published by docker, so the VM's forward chain (not
        # input) limits it to fsicos4.
        restheart_bind_host: 0.0.0.0

        # The deploy checks ask the services on the VM itself rather than
        # through the public names (the production ones point to fsicos2
        # until the cutover).
        coreapp_check_local: true

        # While testing under *.next (sites_next, see above).
        sites_next_config: "{{ ['sites.inventory/templates/application_sites_next_amendment.conf'] if sites_next else [] }}"

        # Backups start at the cutover (off while this is a test copy of the
        # fsicos2 data). The repos have names of their own: the defaults
        # (cpmeta, rdflog, postgis, restheart, cpauth) are fsicos2's, and a
        # bbserver keeps all clients' repos in one directory.
        sites_backup_enable: "{{ not sites_next }}"
        bbclient_remotes:
          - icos1
          - fsicos2
        cpmeta_bbclient_name: sites-meta
        rdflog_bbclient_name: sites-rdflog
        postgis_bbclient_name: sites-postgis
        restheart_bbclient_name: sites-restheart
        cpauth_bbclient_name: sites-auth
        restheart_backup_enable: "{{ sites_backup_enable }}"

        # cpmeta - application
        cpmeta_filestorage_target: /disk/data/metaAppStorage
        cpmeta_backup_enable: "{{ sites_backup_enable }}"
        cpmeta_config_files: "{{ ['application_production.conf', 'application_production_sensitive.conf'] + sites_next_config }}"

        rdflog_backup_enable: "{{ sites_backup_enable }}"
        # fsicos2 still runs 10; the SITES tables are copied with pg_dump.
        rdflog_postgres_version: 15
        # Streaming replicas (icos.pgrep, production.inventory/rdflog.yml)
        # connect over nebula; vm-fsicos4-sites.yml only lets the published
        # port in from the nebula interface.
        rdflog_replication_enable: true

        # cpdata - application
        cpdata_filestorage_target: /disk/data/dataAppStorage
        cpdata_config_files: "{{ ['application_production.conf'] + sites_next_config }}"
        cpdata_b2safe_dry_run: "{{ sites_next }}"

        # cpauth - application
        cpauth_backup_enable: "{{ sites_backup_enable }}"
        # The vault's OAuth clients include ICOS's ENVRI-ID one (staging, #104),
        # which the production cpauth jar does not know: it refuses to start.
        # Drop it until SITES runs a jar that has it.
        cpauth_oauth_conf: "{{ vault_cpauth_oauth_conf | regex_replace('(?s)\\s*envriId\\s*\\{[^}]*\\}', '') }}"
        cpauth_config_files: "{{ ['application_production.conf'] + sites_next_config }}"

        postgis_db_port: 5438
        postgis_hostname: 127.0.0.1
        postgis_backup_enable: "{{ sites_backup_enable }}"

        cpauth_envries:
          - name: SITES
            restheart_url: "http://127.0.0.1:{{ restheart_bind_port }}/{{ restheart_sites_db_name }}"

        data_envries:
          - name: SITES
            restheart_url: "http://127.0.0.1:{{ restheart_bind_port }}/{{ restheart_sites_db_name }}"
            postgis_db_name: "{{ postgis_sites_db_name }}"

    core_server:
      hosts:
        fsicos4:

      vars:
        core_proxy: caddy
        coreapp_httpproxy_host: sites
        coreapp_host_ip: "{{ fsicos4_ip }}"

        core_caddy_name: core-sites-fs4
        # Like the nginx sites on fsicos2 (roles/icos.*/templates/*.conf),
        # minus ICOS-only parts.
        #
        # Client address: cpmeta and cpdata read X-Forwarded-For, cpauth reads
        # X-Real-IP, and they take the whole header value as one address. So
        # set both to {client_ip}: the peer, or the client that fsicos2 forwards
        # for (trusted_proxies in host_vars/fsicos4.yml). Caddy's default would
        # append the peer ("client, fsicos2") for a trusted proxy.
        core_caddy_conf: |
          # Access logs, one JSON file per service (fsicos2's nginx has them
          # too). Caddy leaves Cookie and Authorization headers out.
          (sites_log) {
                  log {
                          output file /var/log/caddy/sites-{args[0]}.log {
                                  roll_size 100MiB
                                  roll_keep 20
                                  roll_keep_for 2160h
                          }
                          format json
                  }
          }

          (client_ip) {
                  header_up X-Forwarded-For {client_ip}
                  header_up X-Real-IP {client_ip}
          }

          {{ doi_domains | first }} {
                  import sites_log doi
                  reverse_proxy {{ coreapp_httpproxy_host }}:8079
          }

          {% if sites_next %}
          (sites_next) {
                  header X-Robots-Tag "noindex, nofollow"
          }
          {% endif %}

          {{ cpmeta_domains | join(' ') }} {
                  {{ 'import sites_next' if sites_next else '' }}
                  import sites_log meta
                  request_body {
                          max_size 60MB
                  }
                  reverse_proxy {{ coreapp_httpproxy_host }}:{{ cpmeta_port }} {
                          import client_ip
                  }
          }

          {{ cpdata_domains | join(' ') }} {
                  {{ 'import sites_next' if sites_next else '' }}
                  import sites_log data
                  reverse_proxy {{ coreapp_httpproxy_host }}:{{ cpdata_port }} {
                          import client_ip
                  }
          }

          # Like fsicos2's restheart.icos-cp.eu, minus the logged-in admin
          # access (use an ssh tunnel to the VM): only the stats app's
          # aggregations are public. Not part of sites_next; the name is new
          # and was never served by fsicos2.
          restheart.fieldsites.se {
                  import sites_log restheart
                  @aggrs {
                          method GET HEAD
                          path /{{ restheart_sites_db_name }}/portaluse/_aggrs*
                  }
                  handle @aggrs {
                          reverse_proxy {{ coreapp_httpproxy_host }}:{{ restheart_bind_port }}
                  }
                  handle {
                          respond 403
                  }
          }

          {{ cpauth_domains | join(' ') }} {
                  {{ 'import sites_next' if sites_next else '' }}
                  import sites_log auth
                  # Only for the services themselves (fsicos2: allow
                  # coreapp_host_ip). From the VM, the request comes from its
                  # bridge address.
                  @downloads_log {
                          path /logs/downloads*
                          not remote_ip 127.0.0.1 {{ coreapp_host_ip }} 10.10.10.25
                  }
                  respond @downloads_log 403
                  reverse_proxy {{ coreapp_httpproxy_host }}:{{ cpauth_port }} {
                          import client_ip
                  }
          }
