# Test mode of the SITES VM on fsicos4 under *.next.fieldsites.se, until the
# cutover from fsicos2 (sites_next in sites.inventory/core.yml). Appended to
# the application.conf of cpmeta, cpdata and cpauth; each reads its own keys.
#
# The host names themselves come from cp*_sites_domain (application_metacore.conf
# and application_auth_views.conf).

# Uploads on the test copy must not register real persistent identifiers:
# the test data is replaced by fresh dumps from fsicos2 at the cutover.
cpmeta.dataUploadService {
	epicPid.dryRun = true
	handle.dryRun = true
}

# ICOS station labelling (not used by SITES): no mails from the test copy.
cpmeta.stationLabelingService.mailSendingActive = false

# A login cookie of its own: separate from production's .fieldsites.se one,
# and matching the test host names (cpauth logs portal use only for hosts
# directly under the cookie domain).
authPub.SITES.authCookieDomain = ".{{ sites_domain }}"

# As in application_staging_amendment.conf: cpauth's own address follows the
# test name.
cpauth.http.serviceHosts.SITES = "{{ cpauth_sites_domain }}"

# The staging look on every server-rendered page (cpauth's viewsCore): a
# striped top border, a construction sign in the title and a badge. Not for
# the live doi.fieldsites.se, which does not get this file.
viewsCore {
	showUnderConstruction = true
	environmentName = "next.fieldsites.se – test"
}
