# Deploy mailman (config files, image build, containers, spam timer)
#   icos play mailman -t mailman
#
# Redeploy only the spam deletion scripts and timer
#   icos play mailman -t mailman_delete_spam
#
# Redeploy backup scripts
#   icos play mailman -t bbclient
#
# Redeploy proxy configuration
#   icos play mailman -t proxy

- hosts: fsicos2
  vars:
    mailman_rest_pass: "{{ vault_mailman_rest_pass }}"
    mailman_rest_allow_deny: "{{ vault_mailman_rest_allow_deny }}"
    mailman_domains:
      - 'lists.icos-ri.eu'
      - 'lists.eric-forum.eu'
      - 'lists.icos-cities.eu'
      - 'lists.kadi-project.eu'

  roles:
    - role: icos.mailman
      tags: mailman

    - role: icos.bbclient2
      tags: bbclient
      vars:
        bbclient_name: mailman
        bbclient_user: root
        bbclient_home: "{{ mailman_home }}/bbclient"
        bbclient_coldbackup: "{{ mailman_home }}"
        bbclient_remotes:
          - fsicos2
          - icos1

  tasks:
    - name: Install proxy for mailman
      tags: proxy
      import_role:
        name: icos.mailman
        tasks_from: proxy
