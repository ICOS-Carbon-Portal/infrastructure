# eric-forum.eu on its own VM on fsicos4 (VM 129), moved from the fsicos2
# container wordpress-eric-forum-dev. It has its own VM because Bluedrop, the
# site's web agency, logs in to it. Same setup as vm-fsicos4-envri.yml.
#
# Settings are in production.inventory/host_vars/fsicos4-ericforum/.
#
#   icos play vm-fsicos4-ericforum                  # everything
#   icos play vm-fsicos4-ericforum caddy dhcp       # fsicos4 routing only
#   icos play vm-fsicos4-ericforum collaborator     # Bluedrop's user
#   icos play vm-fsicos4-ericforum users            # admin accounts, root keys
#
# The VM was created by hand with the steps of `px vm-create`, minus the DHCP
# checks and `icos-auto-dnat run` (disabled on fsicos4): static IP through
# cloud-init, SSH forwarded from fsicos4:60623 in /etc/iptables/rules.v4.

- hosts: fsicos4
  vars:
    ericforum: "{{ hostvars['fsicos4-ericforum'] }}"
  tasks:
    - name: Reserve the VM's static IP in dnsmasq
      tags: dhcp
      include_role:
        name: icos.pve_server
        tasks_from: dhcp_reservation
        apply:
          tags: dhcp
      vars:
        pve_reservation_name: ericforum
        pve_reservation_mac: "{{ ericforum.vm_mac }}"
        pve_reservation_ip: "{{ ericforum.vm_ip }}"

    - name: Configure eric-forum reverse proxy
      tags: caddy
      include_role:
        name: icos.caddy
        apply:
          tags: caddy
      vars:
        caddy_name: ericforum
        caddy_conf: |
          {% if ericforum.ericforum_live %}
          {{ ericforum.ericforum_domain }} {
              reverse_proxy {{ ericforum.vm_ip }}:80 {
                  header_up X-Forwarded-For {remote_host}
                  header_up X-Real-IP {remote_host}
              }
          }

          {{ ericforum.ericforum_redirect_domains | join(', ') }} {
              redir https://{{ ericforum.ericforum_domain }}{uri} permanent
          }
          {% endif %}


- hosts: fsicos4-ericforum
  vars:
    wordpress_home: /docker/wordpress
    wordpress_sites:
      # www.eric-forum.eu is redirected to the apex by the fsicos4 caddy
      # config above, so it stays out of this list.
      - name: ericforum
        domains:
          - "{{ ericforum_domain }}"
        # Bedrock-style layout from Bluedrop's repository.
        document_root: ericwp/web
        wp_config_path: ericwp/wp-config.php
        db_name: ericforum
        db_user: ericforum
        db_password: "{{ vault_wordpress_ericforum_dev_db_password | trim }}"
        db_root_password: "{{ vault_wordpress_ericforum_dev_db_root_password | trim }}"
  roles:
    - role: icos.pve_guest
      tags: guest

    - role: icos.utils
      tags: utils

    - role: icos.docker2
      tags: docker

    - role: icos.nebula
      tags: nebula

    - role: icos.wordpress
      tags: wordpress

    - role: icos.bbclient2
      tags: bbclient
      bbclient_name: fsicos4-ericforum
      bbclient_home: /opt/bbclient-fsicos4-ericforum
      bbclient_remotes:
        - icos1
      bbclient_timer_conf: |
        OnCalendar=*-*-* 03:45:00
        RandomizedDelaySec=30m
      bbclient_timer_content: |
        #!/bin/bash
        set -Eueo pipefail

        cd {{ wordpress_home }}

        compose_down() {
          for project in proxy sites/*; do
            if [[ -f "$project/docker-compose.yml" ]]; then
              (cd "$project" && docker compose down)
            fi
          done
        }

        compose_up() {
          for project in sites/* proxy; do
            if [[ -f "$project/docker-compose.yml" ]]; then
              (cd "$project" && docker compose up -d)
            fi
          done
        }

        trap compose_up EXIT

        compose_down
        {{ bbclient_all }} create --stats --verbose "::{now}" {{ wordpress_home }}
        {{ bbclient_all }} prune --stats --list --keep-daily=14 --keep-weekly=50 --keep-monthly=36
        {{ bbclient_all }} compact --verbose


    # Bluedrop's account: site files, git, wp-cli and logs; no root or docker.
    - role: icos.wordpress_collaborator
      tags: collaborator
      wpc_user: "{{ ericforum_collaborator }}"
      wpc_comment: "Bluedrop (eric-forum.eu web agency)"
      wpc_keys: "{{ ericforum_collaborator_keys }}"
      wpc_site: ericforum
      wpc_home_link: eric-forum.eu
      wpc_wp_path: /var/www/html/ericwp/web
      wpc_git: true

  tasks:
    # After icos.pve_guest has created the admin accounts (user_conf).
    # fsicos4's key must stay: the host's tooling logs in to its VMs as root.
    - name: Check root's SSH keys
      tags: users
      assert:
        that: "'root@fsicos4' in root_keys"

    - name: Install root's SSH keys
      tags: users
      authorized_key:
        user: root
        key: "{{ root_keys }}"
        exclusive: true
