# Static archive of a retired WordPress site, see wordpress-static.yml.

# Old WordPress URLs that only differ by query string: ?p=/?page_id= (pages)
# and ?wpfb_dl= (file downloads), mapped to their static URLs.
include /etc/nginx/conf.d/{{ nginxsite_name }}-query-map.inc;

server {
  listen       443 ssl;
  server_name  {{ static_site_domain }};

  ssl_certificate /etc/letsencrypt/live/{{ nginxsite_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ nginxsite_name }}/privkey.pem;

  root {{ static_site_root }};
  access_log /var/log/nginx/{{ nginxsite_name }}.log;

  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  # Nothing here is executable; don't serve leftover PHP or dotfiles.
  location ~ (\.php$|/\.) {
    return 404;
  }

  if (${{ nginxsite_name }}_page_redirect) {
    return 301 ${{ nginxsite_name }}_page_redirect;
  }

  if (${{ nginxsite_name }}_file_redirect) {
    return 301 ${{ nginxsite_name }}_file_redirect;
  }

  location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|pdf)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}

{% if static_site_redirect_domains | default([]) | length > 0 %}
server {
  listen       443 ssl;
  server_name  {{ static_site_redirect_domains | join(" ") }};

  ssl_certificate /etc/letsencrypt/live/{{ nginxsite_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ nginxsite_name }}/privkey.pem;

  return 301   https://{{ static_site_domain }}$request_uri;
}

{% endif %}
server {
  listen       80;
  server_name  {{ ([static_site_domain] + static_site_redirect_domains | default([])) | join(" ") }};
  return 301   https://{{ static_site_domain }}$request_uri;
}
