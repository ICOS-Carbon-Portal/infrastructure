# Joint landing page for SITES, ICOS Sweden and ACTRIS Sweden.
# Static files from https://github.com/ICOS-Carbon-Portal/actris-icos-sites
server {
  listen       443 ssl;
  server_name  actris-icos-sites.se;

  ssl_certificate /etc/letsencrypt/live/actris-icos-sites/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/actris-icos-sites/privkey.pem;

  root /usr/share/nginx/actris-icos-sites;

  location ^~ /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  # The web root is a git checkout; don't expose .git or other dotfiles.
  location ~ /\. {
    return 404;
  }

  location ~* \.(webp|png|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen       443 ssl;
  server_name  www.actris-icos-sites.se;

  ssl_certificate /etc/letsencrypt/live/actris-icos-sites/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/actris-icos-sites/privkey.pem;

  return 301   https://actris-icos-sites.se$request_uri;
}

server {
  listen       80;
  server_name  actris-icos-sites.se www.actris-icos-sites.se;
  return 301   https://actris-icos-sites.se$request_uri;
}
