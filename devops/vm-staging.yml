- hosts: staging_server
  pre_tasks:
    - name: Create staging directory
      tags: vm
      file:
        path: "/disk/data/staging"
        state: directory
        owner: 1000000
        group: 1000000

    - name: Create NetCDF preview directory
      tags: vm
      file:
        path: "/disk/data/staging/netcdfPreviews"
        state: directory
        owner: 1000000
        group: 1000000

  roles:
    - role: icos.lxd_vm
      tags: vm
      lxd_vm_name: staging
      lxd_vm_docker: True
      lxd_vm_root_size: 200GB
      lxd_vm_devices:
        dataprod:
          path: /data/dataAppStorage/
          source: /disk/data/dataAppStorage/
          type: disk
          readonly: "true"
        netcdf_demo:
          path: /data/netcdf/dataDemo
          source: /disk/data/common/netcdf/dataDemo
          type: disk
          readonly: "true"
        netcdf_previews:
          path: /data/netcdf/previews
          source: /disk/data/staging/netcdfPreviews
          type: disk
        staging:
          path: /data/staging
          source: /disk/data/staging
          type: disk


- hosts: staging
  roles:
    - role: icos.lxd_guest
      tags: guest

    - role: icos.docker
      tags: docker

    - role: icos.restheart
      tags: restheart
