- name: Install htpasswd
  apt:
    name: apache2-utils

# The image runs Verdaccio as uid 10001.
- name: Create Verdaccio directories
  file:
    path: "{{ verdaccio_home }}/{{ item }}"
    state: directory
    owner: "10001"
    group: "65533"
  loop: [conf, storage]

- name: Copy Verdaccio configuration
  template:
    src: config.yaml.j2
    dest: "{{ verdaccio_home }}/conf/config.yaml"
    owner: "10001"
    mode: "0644"
  register: _verdaccio_config

- name: Create Verdaccio htpasswd file
  file:
    path: "{{ verdaccio_home }}/conf/htpasswd"
    state: touch
    owner: "10001"
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Check Verdaccio passwords
  command: htpasswd -vb {{ verdaccio_home }}/conf/htpasswd {{ item.name }} {{ item.password }}
  loop: "{{ verdaccio_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: _verdaccio_pw
  failed_when: false
  changed_when: false
  no_log: true

- name: Set Verdaccio passwords
  command: htpasswd -bB {{ verdaccio_home }}/conf/htpasswd {{ item.item.name }} {{ item.item.password }}
  loop: "{{ _verdaccio_pw.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0
  no_log: true

- name: Copy Verdaccio docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ verdaccio_home }}/docker-compose.yml"
  register: _verdaccio_compose

- name: Start Verdaccio
  community.docker.docker_compose_v2:
    project_src: "{{ verdaccio_home }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if (_verdaccio_compose.changed or _verdaccio_config.changed) else 'auto' }}"

- name: Wait for Verdaccio
  uri:
    url: "http://127.0.0.1:{{ verdaccio_port }}/-/ping"
  register: _verdaccio_up
  until: _verdaccio_up.status == 200
  retries: 30
  delay: 5
  changed_when: false
