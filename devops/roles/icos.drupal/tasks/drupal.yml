---
- name: Create project directory
  file:
    path: "{{ project_dir }}"
    state: directory

- name: Pull source code from git
  git:
    repo: https://github.com/ICOS-Carbon-Portal/drupal
    version: "{{ git_version }}"
    dest: "{{ project_dir }}"
    force: yes

- name: Create {{ project_dir }}/config/ directory
  file: path={{ project_dir }}/config/ state=directory recurse=yes

- name: Copy uploads config
  copy:
    src: uploads.ini
    dest: "{{ project_dir }}/config/uploads.ini"
  register: drupal_uploads_config

- name: Create {{ project_dir }}/files/private/ directory
  file: path={{ project_dir }}/files/private/ state=directory recurse=yes

- name: Create {{ project_dir }}/files/default/files/ directory
  file: path={{ project_dir }}/files/default/files/ state=directory recurse=yes

- name: Copy settings.php
  template:
    src: settings.php.j2
    dest: "{{ project_dir }}/files/default/settings.php"

- name: Create {{ project_dir }}/docker/ directory
  file: path={{ project_dir }}/docker/ state=directory recurse=yes

- name: Copy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker/docker-compose.yml"
  register: docker_compose_yml

- name: Copy environment file
  template:
    src: env.j2
    dest: "{{ project_dir }}/docker/.env"

- name: Create {{ project_dir }}/composer/ directory
  file: path={{ project_dir }}/composer/ state=directory recurse=yes

- name: Copy composer.json
  template:
    src: composer.json.j2
    dest: "{{ project_dir }}/composer/composer.json"
  register: drupal_composer_config

- name: Copy robots.txt
  copy:
    src: "{{ robots_txt }}"
    dest: "{{ project_dir }}/composer/robots.txt.append"
  when: drupal_website_vars.robots_txt is defined
  register: drupal_robots_txt

- name: Persist Composer lock file before container recreation
  include_tasks: persist-lock.yml

- name: Enable maintenance mode
  command: docker exec {{ drupal_website }}_drupal_1 drush maint:set 1
  when: update | bool

- name: (Re)start docker containers
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}/docker"
    state: present
    pull: always
    wait: true
    wait_timeout: 180

# Atomic file replacement changes the inode of single-file bind mounts.
# Recreate Drupal so it sees the current host files, including on retries.
- name: Refresh Drupal single-file bind mounts
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}/docker"
    services: [drupal]
    dependencies: false
    state: present
    recreate: always
    wait: true
    wait_timeout: 180
  when: >-
    update | bool
    or drupal_composer_config.changed
    or drupal_uploads_config.changed
    or drupal_robots_txt.changed

# MariaDB readiness is gated by its healthcheck; this checks that Drupal
# bootstraps and can query its database.
- name: Wait for Drupal to bootstrap with database access
  command:
    argv:
      - docker
      - exec
      - "{{ drupal_website }}_drupal_1"
      - drush
      - php:eval
      - '\Drupal::database()->query("SELECT 1")->fetchField();'
  register: drupal_database_ready
  until: drupal_database_ready.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Check private directory owner
  command: docker exec {{ drupal_website }}_drupal_1 stat -c '%U' /var/www/private/
  register: private_directory_owner
  changed_when: false

- name: Change private directory owner
  command: docker exec {{ drupal_website }}_drupal_1 chown -R www-data:www-data /var/www/private/
  when: private_directory_owner.stdout != "www-data"

- name: Check files directory owner
  command: docker exec {{ drupal_website }}_drupal_1 stat -c '%U' /var/www/html/sites/default/files
  register: files_directory_owner
  changed_when: false

- name: Change files directory owner
  command: docker exec {{ drupal_website }}_drupal_1 chown -R www-data:www-data /var/www/html/sites/default/files
  when: files_directory_owner.stdout != "www-data"

- name: Composer update
  command: docker exec {{ drupal_website }}_drupal_1 composer update
  when: update | bool
  register: result
  changed_when: '"Package operations" in result.stderr'

- name: Update database
  command: docker exec {{ drupal_website }}_drupal_1 drush updb -y
  when: update | bool

# Drush runs in CLI PHP and cannot clear Apache's OPcache after Composer
# replaces dependencies. Restart the web runtime before serving updated code.
- name: Restart Drupal to clear PHP OPcache after dependency updates
  command: docker restart {{ drupal_website }}_drupal_1
  when: update | bool

- name: Disable maintenance mode
  command: docker exec {{ drupal_website }}_drupal_1 drush maint:set 0
  when: update | bool

- name: Clear caches
  command: docker exec {{ drupal_website }}_drupal_1 drush cr

- name: Warm up Drupal cache
  uri:
    url: "https://{{ domain }}/"
    status_code: 200
    return_content: true
  register: drupal_warmup
  until:
    - drupal_warmup.status | default(-1) == 200
    - "'Fatal error' not in (drupal_warmup.content | default(''))"
  retries: 12
  delay: 5
  changed_when: false
