# https://caddyserver.com/docs/install#debian-ubuntu-raspbian

- name: Add caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/trusted.gpg.d/caddy.asc
    mode: '0644'
    force: true

- name: Remove legacy caddy apt repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy.list
    state: absent
  register: caddy_legacy_repo

- name: Install deb822 repository support
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy
    types:
      - deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites:
      - any-version
    components:
      - main
    signed_by: /etc/apt/trusted.gpg.d/caddy.asc
  register: caddy_repo

- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: "{{ 'latest' if caddy_upgrade else 'present' }}"
    update_cache: "{{ caddy_repo.changed or caddy_legacy_repo.changed }}"
  notify: restart caddy

- name: Remove default config file
  ansible.builtin.shell: |
    set -o pipefail
    head -1 Caddyfile | grep -q -F '# The Caddyfile is an easy way' \
      && mv Caddyfile Caddyfile.dist || :
  args:
    chdir: /etc/caddy
    creates: /etc/caddy/Caddyfile.dist
    executable: /bin/bash
  changed_when: false
