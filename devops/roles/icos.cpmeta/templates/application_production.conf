cpmeta {
	port: {{ cpmeta_port }}
	httpBindInterface: "{{ cpmeta_bind_addr }}"

	fileStoragePath: "{{ cpmeta_filestorage_target }}"
{% if cpmetardfstore_enable | default(False) %}

	# The RDF store itself is a separate service (role icos.cpmetardfstore); meta reaches it
	# with an RDF4J SPARQLRepository client and has no access to the store files. The internal
	# endpoints are neither quota-throttled nor response-cached, unlike the public /sparql.
	remoteRdfRepository {
		queryEndpoint: "http://127.0.0.1:{{ cpmetardfstore_port }}/internal/sparql"
		updateEndpoint: "http://127.0.0.1:{{ cpmetardfstore_port }}/internal/sparql"
		adminEndpoint: "http://127.0.0.1:{{ cpmetardfstore_port }}/admin/read-only"
		derivedMetadataEndpoint: "http://127.0.0.1:{{ cpmetardfstore_port }}/internal/derived/v1/resolve"
	}

	# meta only appends to the RDF logs; rdfStore reads them when it restores a fresh store
{% else %}
	rdfStorage.path: "{{ cpmeta_rdfstorage_path }}"
{% endif %}
	rdfLog {
		server {
			port: {{ cpmeta_db_port }}
		}
		credentials {
			db: "{{ cpmeta_db_name }}"
			user: "{{ cpmeta_db_user }}"
			password: "{{ cpmeta_db_pass }}"
		}
	}

	stationLabelingService{
		mailSendingActive = true
		mailing{
			smtpServer: "smtp.protonmail.ch"
			username: "labelling@icos-ri.eu"
			fromAddress: "labelling@icos-ri.eu"
		}
	}

	citations.doi.envries{
		ICOS.password = "{{ doi_password_icos }}"
		#ICOSCities.password should hopefully get filled in automatically thanks to
		#meta's stock application.conf (cpmeta.citations.doi.envries.ICOSCities = ${cpmeta.citations.doi.envries.ICOS})
		SITES.password = "???" #not defined yet
	}

	{% if cpmeta_sentry_dsn is defined %}
		sentry.dsn: "{{ cpmeta_sentry_dsn }}"
	{% endif %}
}

{% include 'roles/icos.cpauth/templates/application_auth_views.conf' %}

{% include 'application_metacore.conf' %}
