cpmeta {
	port: {{ cpmeta_port }}
	httpBindInterface: "{{ cpmeta_bind_addr }}"

	fileStoragePath: "{{ cpmeta_filestorage_target }}"

	# The RDF store itself is a separate service (role icos.cpmeta_rdfstore); meta reaches it
	# over HTTP at cpmeta.rdfStore, from application_shared.conf below, and has no access to
	# the store files.

	stationLabelingService{
		mailSendingActive = true
		mailing{
			smtpServer: "smtp.protonmail.ch"
			username: "labelling@icos-ri.eu"
			fromAddress: "labelling@icos-ri.eu"
		}
	}

	{% if cpmeta_sentry_dsn is defined %}
		sentry.dsn: "{{ cpmeta_sentry_dsn }}"
	{% endif %}
}

{% include 'roles/icos.cpauth/templates/application_auth_views.conf' %}

# The configuration meta shares with rdfStore, which includes the very same template in its own
# application.conf, so the two views cannot drift. See roles/icos.rdf_common/README.md.
{% include 'roles/icos.rdf_common/templates/application_shared.conf' %}
