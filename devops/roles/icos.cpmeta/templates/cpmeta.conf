{% set cpmeta_nginx_var_prefix = cpmeta_nginxsite_name | replace('-', '_') %}
proxy_cache_path /var/cache/nginx/{{ cpmeta_nginxsite_name }}
    levels=1:2
    keys_zone={{ cpmeta_nginx_var_prefix }}_cache:200m
    max_size=20g
    inactive=7d
    use_temp_path=off;

# Limit crawler traffic while allowing bursts from shared client IPs.
limit_req_zone $binary_remote_addr zone={{ cpmeta_nginx_var_prefix }}_per_ip:20m rate=10r/s;
# Apply the same SPARQL rate limit to every client IP.
limit_req_zone $binary_remote_addr zone={{ cpmeta_nginx_var_prefix }}_sparql_per_ip:10m rate=10r/s;

# Bypass caching for non-GET/HEAD requests, authorization headers, or cookies.
map $request_method ${{ cpmeta_nginx_var_prefix }}_skip_cache_method {
    default 1;
    GET     0;
    HEAD    0;
}

map $http_authorization ${{ cpmeta_nginx_var_prefix }}_skip_cache_auth {
    default 0;
    ~.+     1;
}

map $http_cookie ${{ cpmeta_nginx_var_prefix }}_skip_cache_cookie {
    default 0;
    ~.+     1;
}

# Limit anonymous reads of public metadata routes across both hosts using a shared concurrency counter.
# Empty keys exclude other methods, routes, authenticated requests and cookies.
map $uri ${{ cpmeta_nginx_var_prefix }}_objects_observe_path {
    default 0;
    ~^/(objects|collections|resources)(/|$) 1;
}
map "$request_method:${{ cpmeta_nginx_var_prefix }}_objects_observe_path:${{ cpmeta_nginx_var_prefix }}_skip_cache_auth:${{ cpmeta_nginx_var_prefix }}_skip_cache_cookie" ${{ cpmeta_nginx_var_prefix }}_objects_observe_key {
    default "";
    "GET:1:0:0"  "{{ cpmeta_nginx_var_prefix }}_objects";
    "HEAD:1:0:0" "{{ cpmeta_nginx_var_prefix }}_objects";
}
map ${{ cpmeta_nginx_var_prefix }}_objects_observe_key ${{ cpmeta_nginx_var_prefix }}_objects_observe_log {
    default 1;
    "" 0;
}
limit_conn_zone ${{ cpmeta_nginx_var_prefix }}_objects_observe_key zone={{ cpmeta_nginx_var_prefix }}_objects_observe:1m;
log_format {{ cpmeta_nginx_var_prefix }}_objects_observe escape=json
    '{"time":"$msec","request_time":"$request_time",'
    '"status":$status,"cache":"$upstream_cache_status",'
    '"concurrency":"$limit_conn_status","per_ip_rate":"$limit_req_status"}';

server {
    listen       443 ssl;
    server_name  {{ cpmeta_domains | join(" ") }};

    # Resolve lxd hostnames from /etc/hosts
    resolver 127.0.0.53;

    deny 54.36.148.0/24;
    deny 47.128.0.0/16;
    deny 111.225.149.0/24;
    deny 110.249.0.0/16;
    deny 111.225.148.0/24;
    deny 110.249.201.0/24;

    ssl_certificate /etc/letsencrypt/live/{{ cpmeta_certbot_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ cpmeta_certbot_name }}/privkey.pem;

    access_log /var/log/nginx/{{ cpmeta_nginxsite_name }}.access.log;
    access_log /var/log/nginx/{{ cpmeta_nginxsite_name }}-objects-observe.log {{ cpmeta_nginx_var_prefix }}_objects_observe
        buffer=32k flush=5s if=${{ cpmeta_nginx_var_prefix }}_objects_observe_log;

    # Aggregate overload protection for anonymous reads of public metadata routes; reject excess immediately.
    limit_conn {{ cpmeta_nginx_var_prefix }}_objects_observe 40;
    limit_conn_dry_run off;
    limit_conn_status 429;
    limit_conn_log_level notice;

    client_max_body_size 60M;

    set $meta_inner http://{{ cpmeta_host }}:{{ cpmeta_port }};

    if ($http_user_agent ~ thesis-research-bot){
        return 403;
    }

    # Cache public metadata routes; leave other endpoints, including /buildInfo, uncached.
    location ~ ^/(objects|collections|resources)(/|$) {
        limit_req zone={{ cpmeta_nginx_var_prefix }}_per_ip burst=100 nodelay;
        limit_req_status 429;

        proxy_pass $meta_inner;
        proxy_set_header Host {{ cpmeta_proxy_host_header | default('$host') }};
        proxy_set_header X-Forwarded-For $remote_addr;

        # Separate sites, formats, and charsets; the backend omits Vary.
        proxy_cache_key "$scheme|$host|$request_uri|$http_accept|$http_accept_charset";
        proxy_cache {{ cpmeta_nginx_var_prefix }}_cache;
        proxy_cache_valid 200 301 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        # Allow slow metadata/statistics lookups to finish before duplicating work.
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_bypass ${{ cpmeta_nginx_var_prefix }}_skip_cache_method ${{ cpmeta_nginx_var_prefix }}_skip_cache_auth ${{ cpmeta_nginx_var_prefix }}_skip_cache_cookie;
        proxy_no_cache ${{ cpmeta_nginx_var_prefix }}_skip_cache_method ${{ cpmeta_nginx_var_prefix }}_skip_cache_auth ${{ cpmeta_nginx_var_prefix }}_skip_cache_cookie;
        # Location-level headers disable inheritance; repeat HSTS here.
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header Vary "Accept, Accept-Charset" always;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        limit_req zone={{ cpmeta_nginx_var_prefix }}_per_ip burst=100 nodelay;
        limit_req_status 429;

        proxy_pass $meta_inner;
        proxy_set_header Host {{ cpmeta_proxy_host_header | default('$host') }};
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location =/sparql {
        limit_req zone={{ cpmeta_nginx_var_prefix }}_sparql_per_ip burst=50 nodelay;
        limit_req_status 429;

        proxy_pass $meta_inner;
        proxy_set_header Host {{ cpmeta_proxy_host_header | default('$host') }};
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_buffer_size 8k;
        proxy_read_timeout 300s;

        access_log /var/log/nginx/sparql.log postdata;
    }
}

server {
    listen 80;
    server_name  {{ cpmeta_domains | join(" ") }};

    return 301 https://$host$request_uri;
}
