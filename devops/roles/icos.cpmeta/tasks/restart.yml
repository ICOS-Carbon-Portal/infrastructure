
- name: Create application.conf
  copy:
    dest: "{{ cpmeta_home }}/application.conf"
    content: |
      {% for item in cpmeta_config_files %}
      # {{ item }}
      {{ lookup('template', item) }}

      {% endfor %}
  register: _config

# This protects the embedded RDF store while meta shuts down. Where rdfStore is deployed, meta
# has no embedded store, and the call would instead forward to rdfStore's /admin/read-only and
# leave the *shared store* read-only until rdfStore itself is restarted - so it is skipped
# there; rdfStore keeps its own store consistent.
- name: Temporarily switch cpmeta to readonly mode before restart
  uri:
    method: "POST"
    url: "http://127.0.0.1:{{ cpmeta_port }}/admin/switchToReadonlyMode"
  failed_when: no
  when:
    - _restart_needed
    - not (cpmetardfstore_enable | default(False))

- name: Start/restart service
  systemd:
    name: cpmeta.service
    enabled: yes
    state: "{{ 'restarted' if _restart_needed else 'started' }}"

- name: Check that the service responds
  uri:
    url: "https://{{ cpmeta_domains | first }}/buildInfo"
    return_content: yes
  register: r
  failed_when: r.failed
  retries: 30
  delay: 10
  until: not r.failed

# NB: where rdfStore is deployed, this switches the shared store into read-only mode, not just
# this meta instance, and it stays that way until rdfStore is restarted. Only for hosts
# dedicated to read-only serving (cpmeta_readonly_mode), which is what it was always meant for.
- name: Leave cpmeta in readonly mode
  uri:
    method: "POST"
    url: "http://127.0.0.1:{{ cpmeta_port }}/admin/switchToReadonlyMode"
  register: r
  failed_when: r.failed
  retries: 30
  delay: 10
  until: not r.failed
  when: cpmeta_readonly_mode
