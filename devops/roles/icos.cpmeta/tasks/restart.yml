
- name: Create application.conf
  copy:
    dest: "{{ cpmeta_home }}/application.conf"
    content: |
      {% for item in cpmeta_config_files %}
      # {{ item }}
      {{ lookup('template', item) }}

      {% endfor %}
  register: _config

- name: Start/restart service
  systemd:
    name: cpmeta.service
    enabled: yes
    state: "{{ 'restarted' if _restart_needed else 'started' }}"

- name: Check that the service responds
  uri:
    url: "https://{{ cpmeta_domains | first }}/buildInfo"
    return_content: yes
  register: r
  failed_when: r.failed
  retries: 30
  delay: 10
  until: not r.failed

# NB: the store is shared with (and owned by) rdfStore, so this switches the whole store into
# read-only mode, not just this meta instance, and it stays that way until rdfStore is
# restarted. Only for hosts dedicated to read-only serving (cpmeta_readonly_mode).
- name: Leave cpmeta in readonly mode
  uri:
    method: "POST"
    url: "http://127.0.0.1:{{ cpmeta_port }}/admin/switchToReadonlyMode"
  register: r
  failed_when: r.failed
  retries: 30
  delay: 10
  until: not r.failed
  when: cpmeta_readonly_mode
