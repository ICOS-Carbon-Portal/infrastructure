- name: Add systemd service
  template:
    src: cpauth.service
    dest: /etc/systemd/system/cpauth.service
  register: _service

- name: Create application.conf
  copy:
    dest: "{{ cpauth_home }}/application.conf"
    content: |
      {% for item in cpauth_config_files %}
      # {{ item }}
      {{ lookup('template', item) }}

      {% endfor %}
  register: _config

- name: Copy jarfile
  copy:
    src: "{{ cpauth_jar_file }}"
    dest: "{{ cpauth_home }}/cpauth.jar"
    backup: true
  register: _jarfile

- name: Remove all but the five newest of jar file backups
  ansible.builtin.shell: |
    ls -1tr *.jar*~ 2>/dev/null | tail +6 | xargs rm -fv --
  args:
    chdir: "{{ cpauth_home }}"
  register: _r
  changed_when: _r.stdout.startswith("removed")

- name: Start/restart service
  systemd:
    name: cpauth.service
    enabled: yes
    daemon-reload: "{{ 'yes' if _service.changed else 'no' }}"
    state: >-
      {{ 'restarted' if _jarfile.changed or _config.changed else 'started' }}

- name: Check that the service responds
  uri:
    # coreapp_check_local: ask the service itself instead of going through
    # the public domain, e.g. on a new host before DNS points to it.
    url: >-
      {{ 'http://127.0.0.1:%s/buildInfo' % cpauth_port
         if coreapp_check_local | default(false)
         else 'https://%s/buildInfo' % (cpauth_domains | first) }}
    headers:
      Host: "{{ cpauth_domains | first }}"
    return_content: yes
  register: r
  failed_when: r.failed
  retries: 30
  delay: 10
  until: not r.failed
