# rdfStore: the RDF4J store split out of cpmeta (meta repo, docs/rdf-store-split.md).
# It exclusively owns the LMDB/NativeStore files, the SPARQL protocol endpoints and the
# Carbon Portal query indexes. cpmeta talks to it over HTTP with RDF4J's SPARQLRepository.
#
# The ansible "target" name of this service is cpmeta_rdfstore (see cpDeployTarget in meta's
# build.sbt), hence the variable/tag prefix. The configuration this service shares with cpmeta
# is in group_vars/all/core.yml and roles/icos.rdf_common/templates.

cpmeta_rdfstore_user: cpmeta_rdfstore
cpmeta_rdfstore_home: /home/cpmeta_rdfstore

# The public /sparql endpoint is proxied to this service by the proxy on core_server, which in
# the lxd-based inventories is a different machine than core_host - so this follows cpmeta's
# bind address rather than being pinned to loopback. Everything else this service exposes
# (/internal/sparql, /internal/derived, /admin/read-only) is unauthenticated and must not be
# reachable from outside the host: the proxy only routes the exact /sparql path, and no other
# route to port {{ cpmeta_rdfstore_port }} may be opened. Service authentication for the
# internal routes is still an open item in docs/rdf-store-split.md.
cpmeta_rdfstore_bind_addr: "{{ coreapp_bind_addr }}"

# Where the RDF4J store keeps its files. cpmeta must NOT have access to this directory.
cpmeta_rdfstore_rdfstorage_path: "{{ cpmeta_rdfstore_home }}/rdfStorage"

# Whether to fetch the citation metadata of every known data object at startup instead of
# on demand. Turned off in the test/staging deployments, as it was before the split.
cpmeta_rdfstore_citations_eager_warmup: true

cpmeta_rdfstore_java_opts: ""
