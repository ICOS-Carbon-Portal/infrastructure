rdfStore {
	httpBindInterface: "{{ cpmeta_rdfstore_bind_addr }}"
	port: {{ cpmeta_rdfstore_port }}

	rdfStorage.path: "{{ cpmeta_rdfstore_rdfstorage_path }}"
}

cpmeta {
	rdfLog {
		server {
			host: "{{ cpmeta_rdfstore_db_host }}"
			port: {{ cpmeta_rdfstore_db_port }}
		}
		credentials {
			db: "{{ cpmeta_rdfstore_db_name }}"
			user: "{{ cpmeta_rdfstore_db_user }}"
			password: "{{ cpmeta_rdfstore_db_pass }}"
		}
	}

	# Citation enrichment runs in rdfStore, so it needs the same DataCite credential that the
	# pre-split meta process used. The remaining DOI settings come from the shared defaults.
	citations.doi.envries {
		ICOS.password = "{{ doi_password_icos }}"
		# No SITES DOI credential was configured in the pre-split deployment.
		SITES.password = "???"
	}
}

{% include 'roles/icos.cpmeta/templates/application_metacore.conf' %}
