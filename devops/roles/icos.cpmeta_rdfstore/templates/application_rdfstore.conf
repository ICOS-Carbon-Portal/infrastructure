# rdfStore, the RDF4J store and SPARQL service split out of meta.
#
# rdfStore reads the same cpmeta.* configuration as meta. The paths below are the ones only it
# uses. The ones it shares with meta - its own address, the RDF log database, the DataCite
# credentials and the ENVRI hosts - are included from roles/icos.rdf_common below.
cpmeta {
	rdfStorage.path: "{{ cpmeta_rdfstore_rdfstorage_path }}"

	# Whether the citation cache is filled at startup instead of on demand
	citations.eagerWarmUp: {{ 'true' if cpmeta_rdfstore_citations_eager_warmup else 'false' }}
}

{% include 'roles/icos.rdf_common/templates/application_shared.conf' %}
