# rdfStore, the RDF4J store and SPARQL service split out of meta (docs/rdf-store-split.md).
#
# Everything under `rdfStore` belongs to this service alone. The `cpmeta` sections it also reads
# - the RDF log database, the DataCite credentials, the ENVRI hosts and the instance-server/graph
# layout - are shared with meta and rendered from roles/icos.rdf_common/templates below.
rdfStore {
	httpBindInterface: "{{ cpmeta_rdfstore_bind_addr }}"
	port: {{ cpmeta_rdfstore_port }}

	rdfStorage.path: "{{ cpmeta_rdfstore_rdfstorage_path }}"

	# Whether the citation cache is filled at startup instead of on demand
	citations.eagerWarmUp: {{ 'true' if cpmeta_rdfstore_citations_eager_warmup else 'false' }}
}

{% for item in meta_shared_config_files %}
# {{ item }}
{% include 'roles/icos.rdf_common/templates/' + item %}

{% endfor %}
