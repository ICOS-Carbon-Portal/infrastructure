- name: Copy jarfile
  copy:
    src: "{{ cpmetardfstore_jar_file }}"
    dest: "{{ cpmetardfstore_home }}/cpmetardfstore.jar"
    owner: "{{ cpmetardfstore_user }}"
    group: "{{ cpmetardfstore_user }}"
    backup: true
  register: _jarfile

- name: Remove all but the five newest of jar file backups
  ansible.builtin.shell: |
    ls -1tr *.jar*~ 2>/dev/null | tail +6 | xargs rm -fv --
  args:
    chdir: "{{ cpmetardfstore_home }}"
  register: _r
  changed_when: _r.stdout.startswith("removed")

- include_tasks: restart.yml
  vars:
    _restart_needed: "{{ _config.changed or _jarfile.changed }}"
