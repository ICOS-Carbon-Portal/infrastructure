rdfStore {
	httpBindInterface: "{{ cpmetardfstore_bind_addr }}"
	port: {{ cpmetardfstore_port }}

	rdfStorage.path: "{{ cpmetardfstore_rdfstorage_path }}"

	rdfLog {
		server {
			host: "{{ cpmetardfstore_db_host }}"
			port: {{ cpmetardfstore_db_port }}
		}
		credentials {
			db: "{{ cpmetardfstore_db_name }}"
			user: "{{ cpmetardfstore_db_user }}"
			password: "{{ cpmetardfstore_db_pass }}"
		}
	}

	# The log name -> named graph mapping (rdfStore.rdfLogs) and the optional per-log partial
	# replay offsets (rdfStore.rdfLogRestoreFromId) come from the application's own
	# reference.conf, which covers every ICOS and SITES log. Inventories with a different set
	# of logs (ICOS Cities) amend it in an extra config file.
}

{% include 'roles/icos.cpmeta/templates/application_metacore.conf' %}
