# The staging-flavoured deployments (currently only test-fs4) serve ICOS Cities alongside ICOS
# and SITES, so their RDF logs are the stock ones from the application's reference.conf plus
# the city-specific ones. Keep in sync with the instance servers in cpmeta's
# application_staging_amendment.conf: one log per server with a logName, plus one per
# instanceServers.forDataObjects.ICOSCities definition, where the log name is the definition's
# label and the named graph is uriPrefix + label + "/".
#
# A cities-inventory equivalent of this file will be needed whenever rdfStore is rolled out
# there; the ICOS Cities production deployment has no ICOS/SITES logs at all, so it will have
# to erase rdfStore.rdfLogs first rather than add to it.
rdfStore {
	rdfLogs {
		citycpmeta = "https://citymeta.icos-cp.eu/resources/cpmeta/"
		citymeta = "https://citymeta.icos-cp.eu/resources/citymeta/"
		citycolls = "https://citymeta.icos-cp.eu/collections/"
		citydocs = "https://citymeta.icos-cp.eu/documents/"

		cityatmprodcsv = "https://citymeta.icos-cp.eu/resources/cityatmprodcsv/"
		cityetcprodcsv = "https://citymeta.icos-cp.eu/resources/cityetcprodcsv/"
		cityetcmulti = "https://citymeta.icos-cp.eu/resources/cityetcmulti/"
		citygenericcsv = "https://citymeta.icos-cp.eu/resources/citygenericcsv/"
		citynetcdf = "https://citymeta.icos-cp.eu/resources/citynetcdf/"
		citynetcdftimeser = "https://citymeta.icos-cp.eu/resources/citynetcdftimeser/"
		cityziparch = "https://citymeta.icos-cp.eu/resources/cityziparch/"
	}
}
