# cloud-init images (the Proxmox VMs) regenerate /etc/hosts at every boot
# when manage_etc_hosts is on, which drops the block below. The *.nebula
# names then fall through to the icos-cp.eu search domain and its wildcard
# record, i.e. fsicos2's public address.
- name: Check for cloud-init
  stat:
    path: /etc/cloud/cloud.cfg.d
  register: _nebula_cloud_init

- name: Stop cloud-init from regenerating /etc/hosts
  copy:
    dest: /etc/cloud/cloud.cfg.d/99-nebula-etc-hosts.cfg
    content: |
      # Managed by Ansible (icos.nebula): /etc/hosts carries the nebula hosts.
      manage_etc_hosts: false
    mode: "0644"
  when: nebula_hosts_enable and _nebula_cloud_init.stat.exists

- name: Add nebula hosts to /etc/hosts
  blockinfile:
    marker: "# {mark} ansible / nebula"
    create: no
    insertafter: EOF
    path: /etc/hosts
    block: "{{ nebula_hosts_block if nebula_hosts_enable else omit }}"
    state: "{{ 'present' if nebula_hosts_enable else 'absent' }}"
