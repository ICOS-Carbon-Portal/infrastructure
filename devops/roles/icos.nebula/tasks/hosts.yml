# On cloud-init VMs (the Proxmox ones) cloud-init regenerates /etc/hosts
# from this template at every boot. Proxmox's user-data sets
# manage_etc_hosts: true, which overrides /etc/cloud/cloud.cfg.d, so the block
# goes into the template as well. Without it the *.nebula names fall through
# to the icos-cp.eu search domain and its wildcard record, i.e. fsicos2's
# public address.
- name: Check for the cloud-init hosts template
  stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: _nebula_hosts_tmpl

- name: Add nebula hosts to /etc/hosts
  blockinfile:
    marker: "# {mark} ansible / nebula"
    create: no
    insertafter: EOF
    path: "{{ item }}"
    block: "{{ nebula_hosts_block if nebula_hosts_enable else omit }}"
    state: "{{ 'present' if nebula_hosts_enable else 'absent' }}"
  loop: >-
    {{ ['/etc/hosts']
       + (['/etc/cloud/templates/hosts.debian.tmpl'] if _nebula_hosts_tmpl.stat.exists else []) }}
