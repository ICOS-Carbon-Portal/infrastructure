- name: Stop and disable timer
  command: "systemctl disable --now {{ timer_name }}.timer"
  register: r
  changed_when: no
  failed_when:
    - r.rc != 0
    - not r.stderr.endswith('does not exist.')

- name: Remove healthchecks check
  include_tasks: healthcheck_remove.yml
  when: timer_healthcheck | bool
