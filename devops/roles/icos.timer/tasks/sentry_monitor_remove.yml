- name: Look up Sentry monitor
  include_tasks: sentry_monitor_lookup.yml

- name: Report Sentry monitor deletion in check mode
  debug:
    msg: "Would delete Sentry monitor {{ timer_sentry_monitor_slug }}"
  changed_when: true
  when: ansible_check_mode and _timer_sentry_lookup.status == 200

- name: Delete Sentry monitor
  uri:
    url: "{{ _timer_sentry_monitor_api_url }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ timer_sentry_auth_token }}"
    status_code: [202, 204]
  delegate_to: localhost
  become: false
  no_log: true
  register: _timer_sentry_delete
  failed_when: false
  changed_when: true
  when: not ansible_check_mode and _timer_sentry_lookup.status == 200

- name: Ensure Sentry deleted the monitor
  assert:
    that: _timer_sentry_delete.status | default(0) in [202, 204]
    fail_msg: >-
      Deleting {{ timer_sentry_monitor_slug }} failed with status
      {{ _timer_sentry_delete.status | default('none') }}:
      {{ _timer_sentry_delete.json | default(_timer_sentry_delete.msg | default('')) }}
  changed_when: false
  when: not ansible_check_mode and _timer_sentry_lookup.status == 200
