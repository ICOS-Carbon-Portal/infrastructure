services:
  demo:
  wms:
    # Only the native SRS; anything else would make MapProxy reproject the tiles.
    srs: ['{{ mapproxy_grids[mapproxy_wms_grid].srs }}']
    md:
      title: {{ mapproxy_title | to_json(ensure_ascii=False) }}
  tms:
    use_grid_names: true
  wmts:

layers:
{% for name, deliveries in mapproxy_layers | groupby('name') %}
  - name: {{ name }}
    title: {{ deliveries[0].title | to_json(ensure_ascii=False) }}
    sources: [{{ name }}_{{ mapproxy_wms_grid }}_cache]
    tile_sources: [{% for layer in deliveries %}{{ name }}_{{ layer.grid }}_cache{{ ', ' if not loop.last }}{% endfor %}]
{% endfor %}

caches:
{% for layer in mapproxy_layers %}
  {{ layer.name }}_{{ layer.grid }}_cache:
    grids: [{{ layer.grid }}]
    # No upstream: only what is in the GeoPackage is served.
    sources: []
    format: image/png
    cache:
      type: geopackage
      filename: /mapproxy/data/{{ layer.dir }}/current.gpkg
      table_name: {{ layer.table_name }}
{% endfor %}

globals:
  tiles:
    expires_hours: {{ mapproxy_tile_expires_hours }}

grids:
{% for name, grid in mapproxy_grids.items() %}
  {{ name }}:
    srs: '{{ grid.srs }}'
    origin: 'nw'
    bbox: {{ grid.bbox | to_json }}
    bbox_srs: '{{ grid.srs }}'
    tile_size: {{ grid.tile_size | to_json }}
    res: {{ grid.res | to_json }}
{% endfor %}
