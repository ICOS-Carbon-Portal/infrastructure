cpdoi{
	httpBindInterface = "{{ doi_bind_addr }}"
	httpBindPort = {{ doi_port }}
	envri = "{{ doi_envri }}"
	admins = {{ doi_admins | to_json }}

	# Packaged defaults are local-development friendly; deployed environments must be explicit.
	development = false
	skipCacheInvalidation = false

	envriConfigs.{{ doi_envri }}{
		{% if doi_smtp_host is defined %}
		mailing.smtpServer = {{ doi_smtp_host | to_json }}
		{% endif %}
		{% if doi_smtp_username is defined %}
		mailing.username = {{ doi_smtp_username | to_json }}
		{% endif %}
		{% if doi_from_address is defined %}
		mailing.fromAddress = {{ doi_from_address | to_json }}
		{% endif %}
		mailing.password = {{ doi_smtp_password | to_json }}
		mailing.toAddresses = {{ doi_to_addresses | default([], true) | to_json }}
		metaHost = "{{ doi_meta_domain }}"
		publicHost = "{{ doi_domains | first }}"

		{% if doi_test_password is defined %}
		test.member.password = "{{ doi_test_password }}"
		{% else %}
		test = null # Disable the test config in production
		{% endif %}
		production.member.password = "{{ doi_password }}"
	}
}

{% include 'roles/icos.cpauth/templates/application_auth_views.conf' %}
