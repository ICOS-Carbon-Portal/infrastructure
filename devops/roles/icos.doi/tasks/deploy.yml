- name: Add systemd service
  template:
    src: doi.service
    dest: /etc/systemd/system/doi.service
  register: _service

- name: Copy jarfile
  copy:
    src: "{{ doi_jar_file }}"
    dest: "{{ doi_home }}/doi.jar"
    backup: true
  register: _jarfile

- name: Remove all but the five newest of jar file backups
  ansible.builtin.shell: |
    ls -1tr *.jar*~ 2>/dev/null | tail +6 | xargs rm -fv --
  args:
    chdir: "{{ doi_home }}"
  register: _r
  changed_when: _r.stdout.startswith("removed")

- import_tasks: restart.yml
  vars:
    _restart_needed: "{{ _jarfile.changed }}"
    _daemon_reload: "{{ _service.changed }}"
