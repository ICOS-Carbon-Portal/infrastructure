# The one configuration template that meta and rdfStore share. Both services include it in
# their generated application.conf, so their views of these cpmeta.* paths cannot drift. See
# roles/icos.rdf_common/README.md, and "Configuration" in the meta repo's docs/rdf-store-split.md.

# The rdflog PostgreSQL database (role icos.rdflog). meta appends every RDF update to it;
# rdfStore only reads it, when restoring a fresh store or replaying a configured offset.
cpmeta.rdfLog {
	server {
		host: "{{ cpmeta_db_host }}"
		port: {{ cpmeta_db_port }}
	}
	credentials {
		db: "{{ cpmeta_db_name }}"
		user: "{{ cpmeta_db_user }}"
		password: "{{ cpmeta_db_pass }}"
	}
}

# DataCite credentials. meta mints DOIs; rdfStore needs the same credential because it
# enriches query results with citations while evaluating queries.
cpmeta.citations.doi.envries {
	ICOS.password = "{{ doi_password_icos }}"
	# ICOSCities.password is inherited from ICOS by the packaged defaults (rdf-common).
	SITES.password = "???" # no SITES DataCite credential has been configured yet
}

# The ENVRI hosts are kept in a file of their own because cpdata includes them on their own,
# without the rest of this configuration.
{% include 'roles/icos.rdf_common/templates/application_metacore.conf' %}
