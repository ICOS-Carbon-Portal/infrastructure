pve_dnat_bridge: vmbr0
pve_dnat_leases: "/var/lib/misc/dnsmasq.{{ pve_dnat_bridge }}.leases"

# Keys installed for root in VMs created from the cloud-image templates
# (px template-create / px vm-create). Same keys as the fsicos4_vms group.
pve_vm_root_keys: "{{ vault_fsicos4_vms_root_keys | default('') }}"
pve_icos_dir: /etc/icos
pve_dnsmasq_dir: "/etc/dnsmasq.{{ pve_dnat_bridge }}.d"
