# {{ ansible_managed }}
# Local access only; the data is read-only anyway. The primary has no
# "postgres" role, so the postgres system user logs in as the replication
# user (map "replica" in pg_ident.conf).
local   all     all                     peer map=replica
host    all     all     127.0.0.1/32    scram-sha-256
host    all     all     ::1/128         scram-sha-256
