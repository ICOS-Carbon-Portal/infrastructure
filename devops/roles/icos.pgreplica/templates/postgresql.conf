# {{ ansible_managed }}
# A streaming replica of {{ cluster.peer_host }}:{{ cluster.peer_port }};
# primary_conninfo and primary_slot_name are in postgresql.auto.conf
# (written by pg_basebackup -R).

data_directory = '{{ _pgr_data }}'
hba_file = '{{ _pgr_etc }}/pg_hba.conf'
ident_file = '{{ _pgr_etc }}/pg_ident.conf'
external_pid_file = '/var/run/postgresql/{{ cluster.version }}-{{ cluster.name }}.pid'
cluster_name = '{{ cluster.version }}/{{ cluster.name }}'

listen_addresses = 'localhost'
port = {{ cluster.port }}
unix_socket_directories = '/var/run/postgresql'

hot_standby = on
hot_standby_feedback = off

max_connections = {{ pgreplica_max_connections }}
shared_buffers = {{ pgreplica_shared_buffers }}

log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Europe/Stockholm'
timezone = 'Europe/Stockholm'

include_dir = 'conf.d'
